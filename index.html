<!DOCTYPE html>
<!--
  Unjam City - 3D traffic-jam puzzle. Single-file build, no external requests besides the platform SDK.
  Poki build: the Poki SDK script tag is included; the game calls init, gameLoadingFinished, gameplayStart/Stop, commercialBreak and rewardedBreak.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#243b7a">
<title>Unjam City</title>
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#243b7a;overscroll-behavior:none;touch-action:none}
:root{

}
body{font-family:var(--font);font-weight:900;color:#fff;font-size:calc(var(--s)*2.4)}
#app{position:fixed;inset:0}
canvas#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#ui{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.screen{position:absolute;inset:0;display:none;pointer-events:none;flex-direction:column;align-items:center}
.screen.show{display:flex;animation:fadein .25s ease-out}
.screen.dim{background:radial-gradient(ellipse at center,rgba(18,24,70,.4),rgba(18,24,70,.78));justify-content:center}
.screen button,.screen .card,.screen [data-act],.pill{pointer-events:auto}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(calc(var(--s)*-.8)) rotate(1.5deg)}}
/* logo */
.logo{position:relative;font-size:calc(var(--s)*12);line-height:1;letter-spacing:calc(var(--s)*.35);text-align:center;margin:0;animation:floaty 4s ease-in-out infinite;white-space:nowrap}

.logo2{margin-top:calc(var(--s)*-.2);font-size:calc(var(--s)*6.4);letter-spacing:calc(var(--s)*2.2);padding-left:calc(var(--s)*2.2);color:#fff;-webkit-text-stroke:calc(var(--s)*1.1) var(--ink);paint-order:stroke fill;text-shadow:0 calc(var(--s)*.6) 0 var(--ink),0 calc(var(--s)*1) calc(var(--s)*1.2) rgba(0,0,0,.35);display:flex;align-items:center;gap:calc(var(--s)*1.4)}
.logo2::before,.logo2::after{content:"";width:calc(var(--s)*1.7);height:calc(var(--s)*1.7);border-radius:50%;background:#ff5d6c;box-shadow:0 0 0 calc(var(--s)*.4) var(--ink),calc(var(--s)*2.7) 0 0 calc(var(--s)*-.0) #ffd43b,calc(var(--s)*2.7) 0 0 calc(var(--s)*.4) var(--ink);margin-right:calc(var(--s)*3)}
.logo2::after{background:#40c96b;box-shadow:0 0 0 calc(var(--s)*.4) var(--ink);margin:0}
.world{margin-top:calc(var(--s)*1);font-size:calc(var(--s)*2.6);letter-spacing:calc(var(--s)*.5);color:#fff;text-shadow:0 calc(var(--s)*.3) 0 var(--ink),0 0 calc(var(--s)*1) var(--ink),calc(var(--s)*.2) calc(var(--s)*.2) 0 var(--ink),calc(var(--s)*-.2) calc(var(--s)*.2) 0 var(--ink);text-transform:uppercase}

.bar{width:min(60%,calc(var(--s)*50));height:calc(var(--s)*2.4);border-radius:99px;background:rgba(0,0,0,.35);margin-top:calc(var(--s)*5);padding:calc(var(--s)*.4);border:calc(var(--s)*.3) solid rgba(255,255,255,.35)}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(#ffe97a,#ff9d1c);transition:width .2s}
.hint{margin-top:calc(var(--s)*1.5);font-size:calc(var(--s)*2);opacity:.8}

.pill.big{font-size:calc(var(--s)*3.2);margin:0 auto calc(var(--s)*1);pointer-events:none}

.ic{display:inline-flex;width:calc(var(--s)*3.8);height:calc(var(--s)*3.8);align-items:center;justify-content:center;flex:none}
.ic svg{width:100%;height:100%;display:block;filter:drop-shadow(0 calc(var(--s)*.2) 0 rgba(0,0,0,.35))}
.ic.big{width:calc(var(--s)*6.2);height:calc(var(--s)*6.2)}
.icon-btn{width:calc(var(--s)*6.2);height:calc(var(--s)*6.2);padding:calc(var(--s)*1.2);border-radius:calc(var(--s)*2);border:calc(var(--s)*.3) solid rgba(255,255,255,.4);background:linear-gradient(#6f8cff,#3c55d6);box-shadow:0 calc(var(--s)*.5) 0 #1f2f8f;cursor:pointer;margin-left:calc(var(--s)*1)}
.icon-btn:active{transform:translateY(calc(var(--s)*.4));box-shadow:0 calc(var(--s)*.1) 0 #1f2f8f}
.icon-btn svg{width:100%;height:100%;display:block}
.icon-btn.sm{width:calc(var(--s)*4.6);height:calc(var(--s)*4.6);padding:calc(var(--s)*.8);margin-left:calc(var(--s)*1.2)}
.topbar,.hud-top{width:100%;display:flex;align-items:center;padding:calc(var(--s)*1.6) calc(var(--s)*2);padding-top:max(calc(var(--s)*1.6),env(safe-area-inset-top));gap:calc(var(--s)*.5)}
.spacer{flex:1}
/* buttons */
.btn{white-space:nowrap;font:inherit;font-size:calc(var(--s)*3.4);letter-spacing:calc(var(--s)*.15);color:#fff;border:calc(var(--s)*.35) solid rgba(255,255,255,.6);border-radius:calc(var(--s)*3);padding:calc(var(--s)*1.3) calc(var(--s)*4);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:calc(var(--s)*1);position:relative;
text-shadow:0 calc(var(--s)*.35) 0 rgba(0,0,0,.35);background:linear-gradient(#ffc83d,#ff8a1f);box-shadow:0 calc(var(--s)*.9) 0 #b4510a,0 calc(var(--s)*1.4) calc(var(--s)*2) rgba(0,0,0,.35);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(calc(var(--s)*.7));box-shadow:0 calc(var(--s)*.2) 0 #b4510a,0 calc(var(--s)*.4) calc(var(--s)*1) rgba(0,0,0,.3)}
.btn svg{width:calc(var(--s)*3.6);height:calc(var(--s)*3.6)}
.btn.play{font-size:calc(var(--s)*5);padding:calc(var(--s)*1.7) calc(var(--s)*7);background:linear-gradient(#7cf08a,#1fbf55);box-shadow:0 calc(var(--s)*1.1) 0 #0f7a33,0 calc(var(--s)*1.6) calc(var(--s)*2.4) rgba(0,0,0,.4)}
.btn.play:active{box-shadow:0 calc(var(--s)*.25) 0 #0f7a33}
.btn.play svg{width:calc(var(--s)*4.6);height:calc(var(--s)*4.6)}
.btn.blue{background:linear-gradient(#6bc3ff,#2f7df0);box-shadow:0 calc(var(--s)*.9) 0 #1a4aa8,0 calc(var(--s)*1.4) calc(var(--s)*2) rgba(0,0,0,.35)}
.btn.purple{background:linear-gradient(#b48aff,#7b45e8);box-shadow:0 calc(var(--s)*.9) 0 #4b21a8,0 calc(var(--s)*1.4) calc(var(--s)*2) rgba(0,0,0,.35)}
.btn.green{background:linear-gradient(#7cf08a,#1fbf55);box-shadow:0 calc(var(--s)*.9) 0 #0f7a33,0 calc(var(--s)*1.4) calc(var(--s)*2) rgba(0,0,0,.35)}
.btn.grey{background:linear-gradient(#a9a9c9,#7b7b9f);box-shadow:0 calc(var(--s)*.9) 0 #4b4b6b;opacity:.92}
.btn:disabled{opacity:.6;pointer-events:none}
.btn.sm{font-size:calc(var(--s)*2.6);padding:calc(var(--s)*.9) calc(var(--s)*2.6);border-radius:calc(var(--s)*2.4)}
.btn .ic{width:calc(var(--s)*3.2);height:calc(var(--s)*3.2)}
.btn.pulse{animation:pulse 1.6s ease-in-out infinite}
.row{display:flex;gap:calc(var(--s)*1.6);justify-content:center;align-items:center;flex-wrap:wrap}
.bottom .row{flex-wrap:nowrap}.bottom .row .btn{font-size:calc(var(--s)*3);padding:calc(var(--s)*1.1) calc(var(--s)*2.6)}
.col{display:flex;flex-direction:column;gap:calc(var(--s)*1.8);align-items:center;width:100%}
.badge{position:absolute;top:calc(var(--s)*-1);right:calc(var(--s)*-.6);width:calc(var(--s)*3);height:calc(var(--s)*3);border-radius:50%;background:#ff3b5c;border:calc(var(--s)*.3) solid #fff;font-size:calc(var(--s)*2);display:grid;place-items:center;font-style:normal;animation:pulse 1s infinite}
/* menu */
#s-menu{justify-content:flex-start}
.menu-body{flex:1;width:100%;display:flex;flex-direction:column;justify-content:space-between;align-items:center;min-height:0}
.title{display:flex;flex-direction:column;align-items:center;margin-top:calc(var(--s)*-1)}
.bottom{display:flex;flex-direction:column;align-items:center;gap:calc(var(--s)*1.8);padding-bottom:max(calc(var(--s)*3),env(safe-area-inset-bottom))}
.tip{font-size:calc(var(--s)*2);opacity:.92;text-shadow:0 calc(var(--s)*.25) 0 var(--ink),0 0 calc(var(--s)*.8) var(--ink);text-align:center;padding:0 calc(var(--s)*2);max-width:calc(var(--s)*60)}
.dots{display:flex;gap:calc(var(--s)*.8)}
.dot{position:relative;width:calc(var(--s)*4.6);height:calc(var(--s)*4.6);border-radius:50%;background:rgba(20,28,84,.62);border:calc(var(--s)*.3) solid rgba(255,255,255,.35);display:grid;place-items:center;font-style:normal;font-size:calc(var(--s)*2)}
.dot em{font-style:normal;position:relative;z-index:1}
.dot s{position:absolute;right:calc(var(--s)*-.9);top:calc(var(--s)*-1.3);width:calc(var(--s)*2.4);height:calc(var(--s)*2.4);display:block;text-decoration:none;z-index:2}
.dot.done{background:linear-gradient(#58d68d,#27ae60);border-color:#fff}
.dot.cur{background:linear-gradient(#ffd43b,#ff922b);border-color:#fff;transform:scale(1.18);box-shadow:0 0 calc(var(--s)*1.6) rgba(255,212,59,.8)}
.dot.rush:not(.done):not(.cur){border-color:#ff9f43}.dot.hard:not(.done):not(.cur){border-color:#ff5d6c}

#s-hud{justify-content:flex-start}
.hud-top{position:relative;align-items:flex-start}
.hud-mid{position:absolute;left:50%;transform:translateX(-50%);top:max(calc(var(--s)*1.2),env(safe-area-inset-top));display:flex;flex-direction:column;align-items:center;gap:calc(var(--s)*.5);pointer-events:none}
.lvl{font-size:calc(var(--s)*4.6);line-height:1;color:#fff;-webkit-text-stroke:calc(var(--s)*.8) var(--ink);paint-order:stroke fill;text-shadow:0 calc(var(--s)*.6) 0 var(--ink)}
.lvl.rush{color:#ffb454}.lvl.hard{color:#ff7a85}
.hearts{display:flex;gap:calc(var(--s)*.3)}
.h{display:inline-flex;width:calc(var(--s)*4);height:calc(var(--s)*4)}.h svg{width:100%;height:100%;filter:drop-shadow(0 calc(var(--s)*.25) 0 rgba(0,0,0,.4))}
.h.break{animation:hbreak .6s ease-out}

.hud-top .pill{margin-left:auto}
.timer{display:none;align-items:center;gap:calc(var(--s)*1);margin-top:calc(var(--s)*6.8);padding:calc(var(--s)*.5) calc(var(--s)*1.6) calc(var(--s)*.5) calc(var(--s)*.8);border-radius:99px;background:rgba(20,28,84,.7);border:calc(var(--s)*.3) solid rgba(255,255,255,.3);pointer-events:none;font-size:calc(var(--s)*2.8)}
.timer.on{display:flex}
.timer .ic{width:calc(var(--s)*3.2);height:calc(var(--s)*3.2)}
.tbar{width:calc(var(--s)*20);height:calc(var(--s)*1.5);border-radius:99px;background:rgba(0,0,0,.4);overflow:hidden}
.tbar i{display:block;height:100%;background:linear-gradient(#ffd76a,#ff9d1c);transition:width .15s linear}
.timer.low{animation:pulse .5s infinite;border-color:#ff5d6c}.timer.low .tbar i{background:linear-gradient(#ff9aa4,#ff3b4f)}
.timer b{min-width:calc(var(--s)*3.6);text-align:center}
.coach{position:absolute;top:21%;left:50%;transform:translateX(-50%) scale(.8);opacity:0;max-width:86%;text-align:center;font-size:calc(var(--s)*3);padding:calc(var(--s)*1) calc(var(--s)*2.6);border-radius:calc(var(--s)*2.4);background:rgba(20,28,84,.82);border:calc(var(--s)*.3) solid rgba(255,255,255,.5);box-shadow:0 calc(var(--s)*.6) 0 rgba(0,0,0,.3);pointer-events:none;transition:all .25s}

.combo{position:absolute;right:calc(var(--s)*3);top:28%;font-size:calc(var(--s)*5.6);color:#fff59a;-webkit-text-stroke:calc(var(--s)*.7) var(--ink);paint-order:stroke fill;opacity:0;transform:scale(.6) rotate(-6deg);transition:all .12s;text-shadow:0 calc(var(--s)*.6) 0 var(--ink);pointer-events:none}
.combo.on{opacity:1;transform:scale(1) rotate(-6deg)}
.banner{position:absolute;top:34%;left:50%;transform:translateX(-50%) scale(.5);opacity:0;display:flex;flex-direction:column;align-items:center;white-space:nowrap;pointer-events:none}

.banner small{font-size:calc(var(--s)*3.4);color:#ffe066;-webkit-text-stroke:calc(var(--s)*.6) var(--ink);paint-order:stroke fill;text-shadow:0 calc(var(--s)*.5) 0 var(--ink);letter-spacing:calc(var(--s)*.4)}
.banner.go{animation:banner 2s ease-out forwards}
@keyframes banner{0%{opacity:0;transform:translateX(-50%) scale(.4)}14%{opacity:1;transform:translateX(-50%) scale(1.1)}22%{transform:translateX(-50%) scale(1)}78%{opacity:1}100%{opacity:0;transform:translateX(-50%) scale(1) translateY(calc(var(--s)*-2))}}
.hud-bottom{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:flex-end;justify-content:space-between;padding:calc(var(--s)*1.6) calc(var(--s)*2.4) max(calc(var(--s)*2),env(safe-area-inset-bottom))}
.bbtn{position:relative;width:calc(var(--s)*10.6);height:calc(var(--s)*10.6);border-radius:calc(var(--s)*3);border:calc(var(--s)*.4) solid rgba(255,255,255,.7);background:linear-gradient(#7a97ff,#3f5bdc);box-shadow:0 calc(var(--s)*.8) 0 #1f2f8f,0 calc(var(--s)*1.2) calc(var(--s)*2) rgba(0,0,0,.35);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--s)*.2);font:inherit;color:#fff;padding:0;pointer-events:auto;transition:transform .08s}

.left{display:flex;align-items:center;gap:calc(var(--s)*.8);padding:calc(var(--s)*.8) calc(var(--s)*1.8);border-radius:99px;background:rgba(20,28,84,.66);border:calc(var(--s)*.3) solid rgba(255,255,255,.3);margin-bottom:calc(var(--s)*1.2);font-size:calc(var(--s)*2.8);pointer-events:none}

.lbar{width:calc(var(--s)*12);height:calc(var(--s)*1.4);border-radius:99px;background:rgba(0,0,0,.4);overflow:hidden}

/* cards */
